<svg xmlns="http://www.w3.org/2000/svg" width="670" height="502" viewBox="0 0 670 502" role="img" aria-labelledby="title">
  <title id="title">LangChain &amp; LangGraph Cohort</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7F2F3"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#03535F" fill-opacity="0.08"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#03535F"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#C9A227"/>
    </marker>
  </defs>

  <rect width="670" height="502" rx="24" fill="url(#bg)"/>
  <rect width="670" height="502" rx="24" fill="url(#dots)"/>

  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="58" y="78" font-size="13" font-weight="700" letter-spacing="2" fill="#03535F">STATE · NODES · EDGES</text>
    <text x="58" y="104" font-size="26" font-weight="700" fill="#2B2B2B">From LLM call to agent graph</text>

    <!-- START -->
    <circle cx="92" cy="206" r="16" fill="#03535F"/>
    <text x="92" y="244" font-size="12" font-weight="600" fill="#4B4B4B" text-anchor="middle">START</text>
    <line x1="110" y1="206" x2="150" y2="206" stroke="#03535F" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- retrieve -->
    <rect x="154" y="178" width="124" height="56" rx="14" fill="#FFFFFF" stroke="#03535F" stroke-width="3"/>
    <text x="216" y="202" font-size="15" font-weight="700" fill="#03535F" text-anchor="middle">retrieve</text>
    <text x="216" y="221" font-size="11" fill="#4B4B4B" text-anchor="middle">RAG · hybrid</text>
    <!-- doc stack -->
    <rect x="186" y="126" width="34" height="40" rx="4" fill="#EBEFF3" stroke="#9AA5B1" stroke-width="2"/>
    <rect x="196" y="120" width="34" height="40" rx="4" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="2"/>
    <line x1="203" y1="132" x2="223" y2="132" stroke="#9AA5B1" stroke-width="2"/>
    <line x1="203" y1="140" x2="223" y2="140" stroke="#9AA5B1" stroke-width="2"/>
    <line x1="203" y1="148" x2="216" y2="148" stroke="#9AA5B1" stroke-width="2"/>
    <line x1="278" y1="206" x2="318" y2="206" stroke="#03535F" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- agent / model -->
    <rect x="322" y="170" width="140" height="72" rx="16" fill="#03535F"/>
    <text x="392" y="202" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">agent</text>
    <text x="392" y="222" font-size="11" fill="#E7F2F3" text-anchor="middle">model decides</text>

    <!-- tools node + loop -->
    <rect x="336" y="306" width="112" height="50" rx="14" fill="#FFFFFF" stroke="#076573" stroke-width="3"/>
    <text x="392" y="336" font-size="15" font-weight="700" fill="#076573" text-anchor="middle">tools</text>
    <path d="M372 244 C 360 270, 360 282, 372 302" fill="none" stroke="#03535F" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M412 304 C 424 282, 424 270, 412 246" fill="none" stroke="#03535F" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="440" y="284" font-size="11" font-weight="600" fill="#4B4B4B">loop</text>
    <!-- wrench -->
    <circle cx="316" cy="331" r="12" fill="#F6EBC8" stroke="#C9A227" stroke-width="2"/>
    <path d="M311 336 L321 326" stroke="#6B5A1E" stroke-width="3" stroke-linecap="round"/>

    <!-- human review (interrupt) -->
    <line x1="462" y1="206" x2="502" y2="206" stroke="#C9A227" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrowGold)"/>
    <rect x="506" y="172" width="110" height="68" rx="16" fill="#FFFFFF" stroke="#C9A227" stroke-width="3"/>
    <circle cx="534" cy="198" r="9" fill="#C9A227"/>
    <path d="M520 222 C 522 210, 546 210, 548 222 Z" fill="#C9A227"/>
    <text x="582" y="202" font-size="13" font-weight="700" fill="#6B5A1E" text-anchor="middle">human</text>
    <text x="582" y="220" font-size="11" fill="#6B5A1E" text-anchor="middle">interrupt</text>

    <!-- END -->
    <line x1="561" y1="240" x2="561" y2="296" stroke="#03535F" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="561" cy="316" r="16" fill="#FFFFFF" stroke="#03535F" stroke-width="4"/>
    <circle cx="561" cy="316" r="8" fill="#03535F"/>
    <text x="561" y="354" font-size="12" font-weight="600" fill="#4B4B4B" text-anchor="middle">END</text>

    <!-- chain links motif -->
    <g transform="translate(92 330)" fill="none" stroke="#076573" stroke-width="5">
      <rect x="0" y="0" width="54" height="26" rx="13"/>
      <rect x="36" y="0" width="54" height="26" rx="13"/>
      <rect x="72" y="0" width="54" height="26" rx="13"/>
    </g>
    <text x="92" y="384" font-size="12" font-weight="600" fill="#4B4B4B">prompt | model | parser</text>

    <!-- phase chips -->
    <g font-size="12" font-weight="700" text-anchor="middle">
      <rect x="58" y="418" width="96" height="34" rx="17" fill="#E7F2F3" stroke="#03535F" stroke-width="1.5"/>
      <text x="106" y="440" fill="#03535F">LLM</text>
      <rect x="166" y="418" width="96" height="34" rx="17" fill="#E7F2F3" stroke="#03535F" stroke-width="1.5"/>
      <text x="214" y="440" fill="#03535F">RAG</text>
      <rect x="274" y="418" width="96" height="34" rx="17" fill="#E7F2F3" stroke="#03535F" stroke-width="1.5"/>
      <text x="322" y="440" fill="#03535F">AGENTS</text>
      <rect x="382" y="418" width="112" height="34" rx="17" fill="#03535F"/>
      <text x="438" y="440" fill="#FFFFFF">LANGGRAPH</text>
      <rect x="506" y="418" width="110" height="34" rx="17" fill="#F6EBC8" stroke="#C9A227" stroke-width="1.5"/>
      <text x="561" y="440" fill="#6B5A1E">CAPSTONE</text>
    </g>
  </g>
</svg>
